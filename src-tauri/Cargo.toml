[package]
name = "inxaiot-desk-buddy"
version = "0.2.10"
description = "INX 实施工作台"
authors = ["INX"]
edition = "2024"

[lib]
name = "inxaiot_desk_buddy_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
desktop-e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apk-info-axml = "=1.0.13"
apk-info-xml = "=1.0.13"
flate2 = "1.1.9"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2"] }
aes-gcm = "0.11.1"
argon2 = "0.5.3"
aws-lc-rs = "1.18.0"
base64 = "0.22"
csv = "1.3"
futures-util = "0.3"
hex = "0.4"
hostname = "0.4.2"
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
md5 = "0.8"
netdev = { version = "0.46.1", default-features = false, features = ["gateway"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "json", "rustls"] }
rsa = { version = "0.9.10", features = ["pem"] }
russh = { version = "0.63.1", default-features = false, features = ["aws-lc-rs", "flate2"] }
russh-sftp = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "mysql", "sqlite", "migrate", "uuid", "time", "macros"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
tar = "0.4"
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.25.0", features = ["serde", "v7"] }
walkdir = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
